
name: Build Student Clearance EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows application
        run: npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Student-Clearance-Windows
          path: dist/**
